<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="box">

        <form action="">
            <fieldset>
                <legend>informations d'authentification</legend>
            <label for="">username</label>
            <input type="text" name="username" placeholder="entrer username">
            <label for="">Mot de passe</label>
            <input type="password" name="mdp" placeholder="entrer votre mot de passe" minlength="8">
            </fieldset>
<br>
<fieldset>
    <legend>d'autre informations</legend>
        <label for="">Date de naissance</label>
        <input type="date" name="date" placeholder="entrer votre date de naissance">
        <label for="">sexe</label>
        <div>
        <input type="radio" id="homme" name="sexe" value="homme">
        <label for="homme">Homme</label>
        </div>

        <div>
        <input type="radio" id="femme" name="sexe" value="femme">
           <label for="femme">Femme</label>
           </div>
             <label for="">Email</label>
            <input type="email" name="email" placeholder="entrer votre email">
            <label for="">teléphone</label>
            <input type="number" name="phone" placeholder="entrer votre numéro de téléphone" maxlength="10">
            <label for="">Wilaya</label>
            <select name="Wilaya" id="">
                <option value="">Alger</option>
                <option value="">hors wilaya</option>
            </select>
             <label for="">nbr d'enfants</label>
            <input type="number" name="enfants" placeholder="entrer le nbr d'enfants" min="1" max="10">
            <br>
            <label for="">parcours académique</label>
            <textarea name="" id=""></textarea>
            </fieldset>
            <div class="btn">
<button type="submit">submit</button>
            </div>
            

        </form>
    </div>
    
</body>
</html>
